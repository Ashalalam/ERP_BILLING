name: erp_billing
description: BillSprout — Smart ERP & Billing Software by LIFESPROUT Care.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase backend
  supabase_flutter: ^2.5.6

  # PDF generation & printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # File saving / sharing
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  # Image / file picking (prescriptions)
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # QR code generation
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  csv: ^6.0.0
  collection: ^1.18.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
